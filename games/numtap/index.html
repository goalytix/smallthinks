<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>numtap · smallthinks</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="numtap.css">
</head>
<body data-game="numtap">
  <main>
    <div class="numtap-header">
      <div>
        <h1>numtap 🔢</h1>
        <p class="subtitle">Tap a number to color it!</p>
      </div>
      <button id="reset-button" class="big-button">🔄 Reset</button>
    </div>

    <p class="rotate-tip">📱 Turn your phone sideways for bigger boxes!</p>

    <!-- numtap.js fills this with 120 number boxes -->
    <div id="board" class="board"></div>
  </main>

  <script src="../../shared/sound.js"></script>
  <script src="../../shared/hold.js"></script>
  <script src="../../shared/nav.js"></script>
  <script src="numtap.js"></script>
</body>
</html>
